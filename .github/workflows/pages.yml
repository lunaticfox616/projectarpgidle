# GitHub Pages 배포(2026-10-03): main에 푸시되면 웹 묶음(npm run build, dist)을 만들어 Pages에 올린다.
# Hana Caraka 캐릭터 스프라이트는 라이선스상 공개 저장소에 둘 수 없어(원본과 가공본 재배포 금지, 게임 빌드에 넣어 출시하는
# 것은 허용), 배포할 때만 비공개 저장소 lunaticfox616/projectarpgidle-assets에서 받아 묶음에 넣는다. 저장소에는 남지 않는다.
# 읽기 토큰은 저장소 Secrets의 ASSETS_TOKEN. 토큰이 없거나 읽지 못하면 배포를 멈추고, 사이트는 이전 배포 그대로 남는다.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 순서대로 하나씩. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 비공개 스프라이트 토큰 확인
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::error::저장소 Secrets에 ASSETS_TOKEN이 없습니다. projectarpgidle-assets를 읽을 수 있는 토큰을 등록하세요."
            exit 1
          fi
      # 게임이 쓰는 assets 폴더만 받는다(docs의 인계 원본은 받지 않는다). 토큰은 .git에 남기지 않는다.
      - name: 비공개 스프라이트 받기
        uses: actions/checkout@v4
        with:
          repository: lunaticfox616/projectarpgidle-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: _private-assets
          sparse-checkout: assets
          persist-credentials: false
      - name: 스프라이트를 게임 자리에 넣기
        run: |
          cp -R _private-assets/assets/. assets/
          rm -rf _private-assets
          count=$(find assets/playable/hana -name '*.png' | wc -l)
          echo "assets/playable/hana: PNG ${count}개"
          if [ "$count" -eq 0 ]; then
            echo "::error::비공개 저장소에서 캐릭터 스프라이트를 찾지 못했습니다."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 웹 묶음 만들기
        run: npm run build
      - name: 묶음에 스프라이트가 들어갔는지 확인
        run: test "$(find dist/assets/playable/hana -name '*.png' | wc -l)" -gt 0
      - uses: actions/configure-pages@v5
      # 배포 묶음 파일은 하루만 보관한다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
