# 푸시와 PR마다 스모크 및 구조 검사를 실행한다.
# PC·모바일 브라우저 검사는 필요할 때 로컬에서 실행한다.
name: test

on:
  push:
    branches: ['**']
  pull_request:

# 같은 브랜치에 연속으로 푸시하면 이전 실행을 취소한다(마지막 커밋 결과만 의미가 있다).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # 같은 저장소의 PR은 head push 검사 결과가 PR에도 연결된다. pull_request에서 한 번 더
    # 실행하면 동일한 검사를 두 번 수행하므로 외부 포크 PR에서만 이 경로를 쓴다.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json의 engines(>=20.9) 범위 안에서 Node 22로 검사한다.
          node-version: '22'
          cache: npm
      - name: 테스트 의존성 설치
        run: npm ci
      - name: 스모크 검사 실행
        run: npm test
      - name: CSS 구조와 배포 빌드 검증
        run: npm run check:css && npm run build
      - name: 구조 및 복잡도 래칫 검사
        run: npm run check:architecture
