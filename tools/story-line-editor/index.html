<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rignin 대사 편집기</title>
    <link rel="stylesheet" href="./editor.css">
</head>
<body>
    <header class="topbar">
        <div>
            <strong>대사 편집기</strong>
            <span id="line-count">불러오는 중</span>
        </div>
        <nav>
            <button id="reload-button" type="button">새로 읽기</button>
            <button id="undo-save-button" type="button" hidden>방금 저장 되돌리기</button>
            <button id="revert-all-button" type="button" disabled>모두 되돌리기</button>
            <button id="save-button" class="primary" type="button" disabled>저장</button>
        </nav>
    </header>

    <nav class="tabs" role="tablist" aria-label="말하는 이">
        <button type="button" role="tab" data-tab="hero">주인공</button>
        <button type="button" role="tab" data-tab="npc">NPC</button>
        <button type="button" role="tab" data-tab="boss">보스</button>
    </nav>

    <section class="toolbar" aria-label="거르기">
        <label class="grow">
            <span>검색</span>
            <input id="search-input" type="search" placeholder="대사, 말하는 이, 장소, 나오는 때">
        </label>
        <label>
            <span>장소</span>
            <select id="area-select"></select>
        </label>
        <label id="class-filter">
            <span>직업</span>
            <select id="class-select"></select>
        </label>
        <label class="check"><input id="changed-only" type="checkbox"> 고친 줄만</label>
        <label class="check"><input id="warn-only" type="checkbox"> 경고 있는 줄만</label>
    </section>

    <p class="hint">저장하면 게임 파일과 스토리 바이블이 함께 바뀌고, 저장 전 사본이 artifacts/story-line-backups에 남습니다.</p>

    <section id="result" class="result" hidden aria-live="polite">
        <p id="result-text"></p>
        <ul id="result-list"></ul>
        <pre id="result-output" hidden></pre>
    </section>

    <main id="line-list"></main>

    <footer><span id="status-text">대사를 불러오는 중입니다.</span></footer>

    <template id="line-template">
        <article class="line-row">
            <div class="line-meta">
                <span class="speaker"></span>
                <span class="place"></span>
                <span class="when"></span>
            </div>
            <textarea class="line-text" rows="1" spellcheck="false"></textarea>
            <div class="line-foot">
                <span class="count"></span>
                <span class="warns"></span>
                <span class="source"></span>
                <button class="revert-button" type="button" hidden>되돌리기</button>
            </div>
            <p class="was" hidden></p>
        </article>
    </template>

    <script type="module" src="./editor.js"></script>
</body>
</html>
