<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>첫 여정 · 실제 시작 흐름 점검</title>
<style>
body{margin:0;background:#171714;color:#dacba8;font:13px sans-serif;color-scheme:dark}
header{padding:8px 12px;height:20px}iframe{display:block;width:100%;height:calc(100dvh - 36px);border:0}
</style>
<header id="status">실제 게임 · 저장 분리 · 준비 중</header>
<iframe id="game" title="저장 분리 첫 여정" sandbox="allow-scripts allow-same-origin"></iframe>
<script>
(async()=>{
    const response=await fetch('/index.html',{cache:'no-store'});
    if(!response.ok)throw new Error('게임 HTML '+response.status);
    const doc=new DOMParser().parseFromString(await response.text(),'text/html');
    const base=doc.createElement('base');base.href=location.origin+'/';
    const policy=doc.createElement('meta');policy.httpEquiv='Content-Security-Policy';
    policy.content="default-src 'self' data: blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'";
    const bridge=doc.createElement('script');bridge.src='/artifacts/unlock-ui/test-bridge.js';bridge.dataset.manualStart='true';
    doc.head.prepend(base,policy,bridge);
    document.getElementById('game').srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
    document.getElementById('status').textContent='실제 게임 · 저장 분리 · 새로고침하면 초기화';
})().catch(error=>{console.error('First journey review failed',error);document.getElementById('status').textContent=error.message;});
</script>
</html>
