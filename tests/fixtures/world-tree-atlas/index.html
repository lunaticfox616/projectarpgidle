<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세계수 아틀라스 · 실제 전투 테스트</title>
<style>body{margin:0;background:#171714;color:#dacba8;font:13px sans-serif;color-scheme:dark}header{height:38px;display:flex;align-items:center;gap:10px;padding:0 10px;overflow-x:auto;white-space:nowrap}button{flex-shrink:0;background:#302e26;color:inherit;border:1px solid #766a4c;padding:4px 12px}iframe{display:block;width:100%;height:calc(100dvh - 38px);border:0}small{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis}@media(max-width:600px){small{display:none}header{gap:4px;font-size:11px}button{padding:4px 6px;font-size:11px}}</style>
<header>탐험 <button data-mode="first">첫 여정</button><button data-mode="start">아틀라스 시작</button><button data-mode="complete">완료한 노드</button><button data-mode="realms">후반 권역</button><button id="atlas">전체 탐험</button><button id="speed">전투 1배</button><button id="defeat">실패 체험</button><button id="view">전투 보기</button><small id="status">준비 중 · 실제 저장과 분리</small></header>
<iframe id="game" title="실제 세계수 아틀라스 테스트" sandbox="allow-scripts allow-same-origin"></iframe>
<script>
const frame=document.getElementById('game');let seeded=false;
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin)return;
 if(event.data.type==='unlock-lab-status'&&event.data.ready&&!seeded){seeded=true;frame.contentWindow.postMessage({type:'worldtree-lab',mode:new URLSearchParams(location.search).get('review')==='regions'?'realms':'start'},location.origin);}
 if(event.data.type==='worldtree-lab-status'){
  document.getElementById('status').textContent=event.data.message;
  if(seeded)document.querySelectorAll('header button').forEach(button=>button.disabled=false);
 }
 if(event.data.type==='worldtree-view-status')document.getElementById('view').textContent=event.data.battle?'지도 보기':'전투 보기';
});
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-lab',mode:button.dataset.mode},location.origin));
const legalButton=document.createElement('button');legalButton.textContent='일반 장비 체험';legalButton.id='legal-build';
document.querySelector('[data-mode="start"]').after(legalButton);
const craftedButton=document.createElement('button');craftedButton.textContent='제작 장비 체험';
legalButton.after(craftedButton);
legalButton.onclick=()=>loadReviewBuild('legal-build.json', 'legal', legalButton);
craftedButton.onclick=()=>loadReviewBuild('crafted-t15-build.json', 'crafted', craftedButton);
const grandButton=document.createElement('button');grandButton.textContent='대균열 입장 체험';grandButton.id='grand-review';
document.getElementById('atlas').after(grandButton);
grandButton.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-grand-review'},location.origin);
const altarButton=document.createElement('button');altarButton.textContent='융합 재료 체험';altarButton.id='altar-review';
grandButton.after(altarButton);
altarButton.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-altar-review'},location.origin);
const colonyButton=document.createElement('button');colonyButton.textContent='군락지 입장 체험';colonyButton.id='colony-review';
altarButton.after(colonyButton);
colonyButton.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-colony-review'},location.origin);
const chaseButton=document.createElement('button');chaseButton.textContent='근접 접근 재현';chaseButton.id='chase-review';
colonyButton.after(chaseButton);
chaseButton.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-chase-review'},location.origin);
const runeButton=document.createElement('button');runeButton.textContent='룬 제작 재료';runeButton.id='rune-review';
chaseButton.after(runeButton);
runeButton.onclick=()=>frame.contentWindow.postMessage({type:'worldtree-rune-review'},location.origin);
const performanceButton=document.createElement('button');performanceButton.textContent='10초 성능 측정';
performanceButton.id='performance-review';runeButton.after(performanceButton);
performanceButton.onclick=()=>{
 performanceButton.disabled=true;document.getElementById('status').textContent='10초 측정 중 · 이 탭을 유지하세요';
 frame.contentWindow.postMessage({type:'worldtree-performance-start'},location.origin);
};
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data.type!=='worldtree-performance-result')return;
 const sample=event.data;performanceButton.disabled=false;
 const output=document.getElementById('status');output.dataset.performance=JSON.stringify(sample);
 output.textContent=sample.interrupted?'탭이 숨겨져 측정을 중단했습니다. 다시 실행하세요.'
  :`×${sample.speed} · 프레임 중앙 ${sample.frameMedian} / p95 ${sample.frameP95}ms · 틱 중앙 ${sample.tickMedian} / p95 ${sample.tickP95}ms (${sample.frames}프레임, ${sample.ticks}틱)`;
});
async function loadReviewBuild(file,mode,button){
 button.disabled=true;
 try {
  const response=await fetch(file,{cache:'no-store'});if(!response.ok)throw new Error('체험 장비 '+response.status);
  frame.contentWindow.postMessage({type:'worldtree-lab',mode,snapshot:await response.json()},location.origin);
 } catch(error){console.error(error);document.getElementById('status').textContent=error.message;}
 finally{button.disabled=false;}
}
let fast=false;document.getElementById('speed').onclick=()=>{fast=!fast;document.getElementById('speed').textContent=fast?'전투 4배':'전투 1배';frame.contentWindow.postMessage({type:'worldtree-speed',speed:fast?4:1},location.origin);};
document.getElementById('defeat').onclick=()=>frame.contentWindow.postMessage({type:'worldtree-defeat'},location.origin);
document.getElementById('view').onclick=()=>frame.contentWindow.postMessage({type:'worldtree-view'},location.origin);
document.getElementById('atlas').onclick=()=>frame.contentWindow.postMessage({type:'worldtree-atlas'},location.origin);
// Wait for the guest boot and initial class selection before accepting fixture switches.
document.querySelectorAll('header button').forEach(button=>button.disabled=true);
(async()=>{
 const response=await fetch('/index.html',{cache:'no-store'});if(!response.ok)throw new Error('HTML '+response.status);
 const doc=new DOMParser().parseFromString(await response.text(),'text/html');
 doc.querySelector('#app-update-registration').remove();
 doc.querySelectorAll('script[src]').forEach(s=>{if(new URL(s.getAttribute('src'),location.origin).origin!==location.origin)s.remove();});
 const base=doc.createElement('base');base.href=location.origin+'/';
 const policy=doc.createElement('meta');policy.httpEquiv='Content-Security-Policy';policy.content="connect-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'none'; frame-src 'none'; form-action 'none'; object-src 'none'";
 const bridge=doc.createElement('script');bridge.src='/artifacts/unlock-ui/test-bridge.js';
 const seed=doc.createElement('script');seed.src='/tests/fixtures/world-tree-atlas/seed.js';
 doc.head.prepend(base,policy,bridge,seed);frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
})().catch(error=>{console.error(error);document.getElementById('status').textContent=error.message;});
</script></html>
